<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { --paper: #faf9f6; --card: #fdfcf9; --ink: #1b1a17; --ink70: #4d4a44; --ink45: #87817a; --line: rgba(27,26,23,.16); --cinnabar: #8a3a2e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1440px; overflow: hidden; position: relative;
    padding: 92px 80px 96px; display: flex; flex-direction: column;
    background: var(--paper); color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
  }
  .eyebrow { font-family: "SFMono-Regular", Menlo, monospace; font-size: 23px; letter-spacing: .1em; text-transform: uppercase; color: var(--cinnabar); }
  h1 { margin-top: 34px; font-family: "Songti SC", "STSong", serif; font-weight: 600; font-size: 78px; line-height: 1.25; letter-spacing: -.03em; }
  h1 em { font-style: normal; color: var(--cinnabar); }
  .cols { flex: 1; margin-top: 68px; display: grid; grid-template-columns: 1fr 1fr; gap: 44px; }
  .col { display: flex; flex-direction: column; padding: 38px 36px 26px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); }
  .col h2 { font-family: "Songti SC", serif; font-size: 42px; font-weight: 600; letter-spacing: -.02em; }
  .col.bad h2 { color: var(--ink45); }
  .col.good { border-color: rgba(36,59,83,.4); box-shadow: 0 22px 50px rgba(27,26,23,.08); }
  ol { flex: 1; margin-top: 24px; list-style: none; display: flex; flex-direction: column; }
  li {
    flex: 1; display: flex; align-items: center;
    font-size: 33px; line-height: 1.45; color: var(--ink70);
    padding: 14px 0 14px 48px; position: relative; border-top: 1px solid var(--line);
  }
  li:first-child { border-top: 0; }
  li::before { content: "→"; position: absolute; left: 0; color: var(--ink45); }
  .col.good li::before { content: "✓"; color: var(--cinnabar); }
  .verdict { margin-top: auto; padding-top: 48px; font-size: 36px; line-height: 1.7; color: var(--ink70); }
  .verdict b { color: var(--ink); font-weight: 600; }
  .foot { position: absolute; left: 80px; bottom: 44px; font-family: "SFMono-Regular", Menlo, monospace; font-size: 20px; letter-spacing: .12em; color: var(--ink45); }
</style>
</head>
<body>
  <div class="eyebrow">同样的 20 分钟</div>
  <h1>手抄生词<br>vs <em>一条流水线</em></h1>

  <div class="cols">
    <div class="col bad">
      <h2>手抄</h2>
      <ol>
        <li>读到生词，切出去查</li>
        <li>抄进本子或备忘录</li>
        <li>合上，感觉学过了</li>
        <li>再也没有翻开</li>
      </ol>
    </div>
    <div class="col good">
      <h2>流水线</h2>
      <ol>
        <li>整篇粘进去</li>
        <li>自动挑 8–16 个表达</li>
        <li>边读边选中，自动成卡</li>
        <li>导出到 Anki 复习</li>
      </ol>
    </div>
  </div>

  <p class="verdict">差别不在努力，<b>在最后那一步有没有复习。</b></p>
  <div class="foot">closeread.weijia.asia</div>
</body>
</html>
