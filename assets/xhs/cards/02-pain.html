<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { --paper: #faf9f6; --ink: #1b1a17; --ink70: #4d4a44; --ink45: #87817a; --line: rgba(27,26,23,.16); --cinnabar: #8a3a2e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1440px; overflow: hidden; position: relative;
    background: var(--paper); color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
  }
  .wrap { padding: 96px 84px 0; }
  .eyebrow { font-family: "SFMono-Regular", Menlo, monospace; font-size: 23px; letter-spacing: .22em; text-transform: uppercase; color: var(--cinnabar); }
  h1 { margin-top: 48px; font-family: "Songti SC", "STSong", serif; font-weight: 600; font-size: 118px; line-height: 1.18; letter-spacing: -.035em; }
  h1 em { font-style: normal; color: var(--ink45); }
  .rule { margin: 64px 0 0; height: 1px; background: var(--line); }
  .note { margin-top: 54px; font-size: 40px; line-height: 1.75; color: var(--ink70); }
  .quote {
    position: absolute; left: 84px; right: 84px; bottom: 118px;
    padding: 44px 48px; border-left: 3px solid var(--cinnabar);
    background: #f3f1ec;
  }
  .quote p { font-family: "Songti SC", serif; font-size: 40px; line-height: 1.7; color: var(--ink); }
  .quote span { display: block; margin-top: 18px; font-size: 26px; color: var(--ink45); letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">收藏夹</div>
    <h1>收藏了 <em>30</em> 篇<br>读完 <em>0</em> 篇</h1>
    <div class="rule"></div>
    <p class="note">不是英语不够好，<br>是读完以后，<br>什么都没留下。</p>
  </div>

  <div class="quote">
    <p>“查过的词第二天就忘，<br>划过的句子再也没回来看。”</p>
    <span>—— 说的是三个月前的我自己</span>
  </div>
</body>
</html>
