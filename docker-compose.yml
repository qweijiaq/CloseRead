services:
  app:
    build: .
    container_name: closeread-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Shanghai}
      LEARN_HOST: 0.0.0.0
      LEARN_PUBLIC_HOST: ${LEARN_PUBLIC_HOST:?Set LEARN_PUBLIC_HOST in .env}
      LEARN_DATA_DIR: /app/data
      LEARN_PACKS_DIR: /app/packs
      # Encrypts visitor provider keys at rest. Changing it makes stored keys
      # unreadable, so keep the value backed up.
      LEARN_SECRET: ${LEARN_SECRET:?Set LEARN_SECRET in .env}
      # Optional: ?owner=<key> pins the site owner's workspace across browsers.
      LEARN_OWNER_KEY: ${LEARN_OWNER_KEY:-}
    volumes:
      - ./data:/app/data
      - ./packs:/app/packs
    networks:
      - folio_default
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4317/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  folio_default:
    external: true
